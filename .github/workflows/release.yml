name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (must match package.json version, e.g. v0.1.2)'
        required: true
        default: 'v0.1.2'

permissions:
  contents: write

jobs:
  release:
    name: Test, Publish & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Resolve tag name
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${TAG#v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${PKG_VERSION}. Bump the version, commit, then tag again."
            exit 1
          fi
        env:
          TAG: ${{ steps.vars.outputs.tag }}

      - name: Build package tarball
        run: |
          TGZ_NAME=$(npm pack)
          echo "PACKED_FILE=$TGZ_NAME" >> "$GITHUB_ENV"
          echo "Created package: $TGZ_NAME"

      # This fork does not publish from CI. Upstream's workflow relied on a
      # repository secret (NPM_TOKEN), and a fork does not inherit secrets; a
      # hard publish step would fail here and abort the release. Publish by hand
      # from a logged-in checkout when a release should reach npm:
      #   npm publish --access public --registry=https://registry.npmjs.org/

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          files: ${{ env.PACKED_FILE }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.vars.outputs.tag, '-rc') || contains(steps.vars.outputs.tag, '-beta') || contains(steps.vars.outputs.tag, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
